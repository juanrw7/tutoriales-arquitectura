upstream django_backend {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Futuro Strangler Pattern: una location /api/v2/ podra dirigir
    # el trafico al nuevo microservicio sin reemplazar /api/v1/.
    # No se crea todavia una ruta a Flask: corresponde al siguiente paso.
}
