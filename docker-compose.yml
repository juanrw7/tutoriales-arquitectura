services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tienda_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
    - database
  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    ports:
    - 80:80
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web_django:
        condition: service_healthy
      pagos_flask:
        condition: service_healthy
    networks:
    - edge
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1/health/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
  web_django:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-tienda_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      DB_HOST: db
      DB_PORT: '5432'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY en .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-BANCO}
      ESTUDIANTE_NOMBRE: Juan Manuel Ramirez
      PAYMENTS_LOG_DIR: /app/logs
    volumes:
    - payments_data:/app/logs
    command:
    - gunicorn
    - Tienda.wsgi:application
    - --bind
    - 0.0.0.0:8000
    - --workers
    - '2'
    - --access-logfile
    - '-'
    - --error-logfile
    - '-'
    expose:
    - '8000'
    networks:
    - edge
    - database
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  pagos_flask:
    build: ./microservicio_pagos
    restart: unless-stopped
    expose:
    - '5000'
    networks:
    - edge
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  postgres_data: null
  payments_data: null
networks:
  edge: {}
  database:
    internal: true
